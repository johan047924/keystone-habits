<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keystone Habits</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#20201e;--muted:#777771;--line:#e5e5df;--accent:#30302d;--soft:#eeeeea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:32px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-size:25px;font-weight:700;letter-spacing:-.6px}.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}.tabs button{border:0;background:transparent;padding:8px 13px;border-radius:9px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px #00000010}.date{color:var(--muted);font-size:14px;margin-bottom:7px}.title{font-size:34px;letter-spacing:-1px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.card.wide{grid-column:1/-1}.num{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}.card h2{font-size:18px;margin:5px 0 6px}.desc{color:var(--muted);font-size:14px;margin:0 0 16px}.checkrow{display:flex;align-items:center;gap:12px}.check{width:25px;height:25px;border:1.5px solid #aaa;border-radius:8px;background:#fff;appearance:none}.check:checked{background:var(--accent);border-color:var(--accent);position:relative}.check:checked:after{content:'✓';color:white;position:absolute;font-size:17px;left:5px;top:-2px}.status{font-size:14px}.small{font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.rangeRow{display:flex;align-items:center;gap:14px}.pct{font-weight:700;font-size:22px;min-width:58px}.slots{display:grid;gap:8px}.slot{display:flex;gap:8px;align-items:center}.slot span{width:20px;color:var(--muted)}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fafaf8;padding:10px 11px;outline:none}input[type=text]:focus,textarea:focus{border-color:#aaa;background:white}.weekbox{background:var(--soft);padding:12px 14px;border-radius:12px;margin-top:14px}.weekbox strong{display:block}.actions{display:flex;gap:8px;margin:22px 0}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px}.btn.dark{background:var(--accent);color:#fff;border-color:var(--accent)}.report{display:grid;gap:12px}.metric{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric b{font-size:16px}.notice{background:var(--soft);border-radius:14px;padding:15px;margin-top:16px}.historyRow{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.historyHead{font-size:12px;color:var(--muted)}.trend{font-variant-numeric:tabular-nums}.empty{color:var(--muted);padding:25px 0}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;max-width:600px;width:100%;padding:24px}.modalbox h2{margin-top:0}.strategy{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.strategy label{display:flex;gap:10px}.footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.top{align-items:flex-start;gap:12px;flex-direction:column}.historyRow{grid-template-columns:1.5fr repeat(4,1fr);font-size:12px}.wrap{padding-top:22px}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f7f7f5"><link rel="apple-touch-icon" href="icon-192.png"></head><body><div class="wrap">
<div class="top"><div class="brand">Keystone Habits</div><div class="tabs"><button id="todayTab" class="active">Today</button><button id="reportTab">Report</button><button id="historyTab">History</button></div></div>
<main id="app"></main><div class="footer">Your records stay in this browser. No spiritual score—just a record of what you chose to track.</div></div>
<div class="modal" id="modal"><div class="modalbox"><h2>Evidence-informed ideas</h2><p class="sub">These are optional strategies commonly used in behavior-change research. Nothing will be added unless you choose it.</p><div id="strategies"></div><div class="actions"><button class="btn" onclick="closeModal()">Not now</button><button class="btn dark" onclick="addStrategies()">Add selected</button></div></div></div>
<script>
const KEY='keystoneHabitsV1';let db=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today';
const goals=[
{id:'gospel',name:'Pray the Gospel',desc:'Record whether you prayed the Gospel today.',kind:'check',target:'7 days'},
{id:'bible',name:'Bible reading plan',desc:'About 4 chapters, 5 days each week.',kind:'check',target:'5 days'},
{id:'awareness',name:"Awareness of God's presence",desc:'Your estimate of how much of today you lived with awareness of God.',kind:'range',target:'daily estimate'},
{id:'faith',name:'Ask someone about their faith',desc:'One intentional conversation each week.',kind:'weeklyPerson',target:'1 person'},
{id:'thanks',name:'Write 5 things thankful for',desc:'Five short entries each day.',kind:'thanks',target:'5/day'}];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function iso(d){return d.toISOString().slice(0,10)}function dayKey(d){return iso(d)}function monday(d){let x=new Date(d);x.setHours(12,0,0,0);let n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function weekKey(d){return iso(monday(d))}function getDay(k){db.days=db.days||{};db.days[k]=db.days[k]||{gospel:false,bible:false,awareness:0,thanks:['','','','','']};return db.days[k]}function getWeek(k){db.weeks=db.weeks||{};db.weeks[k]=db.weeks[k]||{faith:false,person:''};return db.weeks[k]}
function fmt(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}function fmtWeek(k){let s=new Date(k+'T12:00:00'),e=new Date(s);e.setDate(e.getDate()+6);return s.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+e.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(view+'Tab').classList.add('active');if(view==='today')renderToday();if(view==='report')renderReport();if(view==='history')renderHistory()}
function renderToday(){let d=new Date(),k=dayKey(d),day=getDay(k),wk=weekKey(d),w=getWeek(wk);document.getElementById('app').innerHTML=`<div class="date">${fmt(d)}</div><h1 class="title">Today</h1><p class="sub">A simple place to record the things you want to practice.</p><div class="grid">
${checkCard(1,goals[0],day.gospel,'gospel',k)}${checkCard(2,goals[1],day.bible,'bible',k)}${rangeCard(day.awareness,k)}${faithCard(w)}${thanksCard(day,k)}</div><div class="actions"><button class="btn" onclick="openModal()">Want some evidence-informed ideas?</button><button class="btn" onclick="exportData()">Export data</button></div>`}
function checkCard(n,g,val,id,k){return `<section class="card"><div class="num">Goal ${n}</div><h2>${g.name}</h2><p class="desc">${g.desc}</p><div class="checkrow"><input class="check" type="checkbox" ${val?'checked':''} onchange="setDay('${id}',this.checked)"><span class="status">${val?'Completed today':'Not recorded yet'}</span></div><div class="weekbox"><strong>This week</strong><span class="small">${weekCount(id,weekKey(new Date()))} / ${id==='bible'?5:7} days recorded</span></div></section>`}
function rangeCard(v,k){return `<section class="card"><div class="num">Goal 3</div><h2>Awareness of God's presence</h2><p class="desc">Your estimate of what percentage of today you lived with awareness of God.</p><div class="rangeRow"><div class="pct" id="pct">${v||0}%</div><input type="range" min="0" max="100" step="5" value="${v||0}" oninput="setAwareness('${k}',this.value)"></div><p class="small">This is a reflection, not a score.</p></section>`}
function faithCard(w){return `<section class="card"><div class="num">Goal 4 · Weekly</div><h2>Ask someone about their faith</h2><p class="desc">Have one intentional conversation about how someone is doing in their faith.</p><div class="checkrow"><input class="check" type="checkbox" ${w.faith?'checked':''} onchange="setWeek('faith',this.checked)"><span class="status">${w.faith?'Recorded':'Not recorded yet'}</span></div><input type="text" placeholder="Person's name (optional)" value="${esc(w.person)}" oninput="setWeek('person',this.value)" style="margin-top:12px"></section>`}
function thanksCard(day,k){return `<section class="card wide"><div class="num">Goal 5</div><h2>Write 5 things thankful for</h2><p class="desc">Five short entries for today.</p><div class="slots">${day.thanks.map((x,i)=>`<div class="slot"><span>${i+1}</span><input type="text" placeholder="I'm thankful for…" value="${esc(x)}" oninput="setThanks('${k}',${i},this.value)"></div>`).join('')}</div></section>`}
function weekCount(id,wk){let s=new Date(wk+'T12:00:00'),n=0;for(let i=0;i<7;i++){let k=iso(s);if(getDay(k)[id])n++;s.setDate(s.getDate()+1)}return n}
function weekAwareness(wk){let s=new Date(wk+'T12:00:00'),a=[];for(let i=0;i<7;i++){let v=getDay(iso(s)).awareness;if(v>0)a.push(v);s.setDate(s.getDate()+1)}return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}
function weekThanks(wk){let s=new Date(wk+'T12:00:00'),n=0;for(let i=0;i<7;i++){n+=getDay(iso(s)).thanks.filter(x=>x.trim()).length;s.setDate(s.getDate()+1)}return n}
function renderReport(){let wk=weekKey(new Date()),prev=new Date(wk+'T12:00:00');prev.setDate(prev.getDate()-7);let p=weekKey(prev),g=weekCount('gospel',wk),b=weekCount('bible',wk),a=weekAwareness(wk),f=getWeek(wk).faith,t=weekThanks(wk);document.getElementById('app').innerHTML=`<div class="date">Week of ${fmtWeek(wk)}</div><h1 class="title">Weekly report</h1><p class="sub">A neutral reflection on what you recorded this week.</p><section class="card"><div class="report">${metric('Pray the Gospel',g+'/7 days',g)}${metric('Bible reading',b+'/5 days',b/5*7)}${metric("Awareness of God's presence",a+'% average',a)}${metric('Faith conversation',f?'1/1':'0/1',f?100:0)}${metric('Thankfulness',t+'/35 entries',t/35*100)}</div></section><div class="notice"><strong>Things to notice</strong><p>${notice(g,b,a,f,t)}</p></div><div class="actions"><button class="btn" onclick="view='history';render()">See 4-week history</button></div><p class="small">Previous week: ${fmtWeek(p)} · Gospel ${weekCount('gospel',p)}/7 · Bible ${weekCount('bible',p)}/5 · Awareness ${weekAwareness(p)}%</p>`}
function metric(n,v,p){return `<div class="metric"><span>${n}</span><b>${v}</b></div>`}function notice(g,b,a,f,t){let arr=[];if(g>=6)arr.push('Gospel prayer was recorded consistently.');else if(g<=3)arr.push('Gospel prayer had several unrecorded days.');if(b>=5)arr.push('Your Bible reading target was met.');else arr.push('Bible reading was the area with the most room to become consistent this week.');if(a)arr.push(`Your awareness estimate averaged ${a}%.`);if(!f)arr.push('No faith conversation was recorded this week.');if(t<25)arr.push('Thankfulness entries were incomplete on some days.');else arr.push('Thankfulness was recorded frequently.');return arr.join(' ') }
function renderHistory(){let weeks=[];let d=monday(new Date());d.setDate(d.getDate()-7);for(let i=3;i>=0;i--){let x=new Date(d);x.setDate(x.getDate()-7*i);let k=iso(x);weeks.push(k)}document.getElementById('app').innerHTML=`<div class="date">Last 4 completed weeks</div><h1 class="title">History</h1><p class="sub">Completed weeks only. The current week stays in Report.</p><section class="card"><div class="historyRow historyHead"><div>Goal</div>${weeks.map(x=>`<div>${new Date(x+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`).join('')}</div>${historyRow('Gospel prayer',weeks,k=>weekCount('gospel',k)+'/7')}${historyRow('Bible reading',weeks,k=>weekCount('bible',k)+'/5')}${historyRow('Awareness',weeks,k=>weekAwareness(k)+'%')}${historyRow('Faith conversation',weeks,k=>getWeek(k).faith?'1/1':'0/1')}${historyRow('Thankfulness',weeks,k=>weekThanks(k)+'/35')}</section><div class="notice"><strong>Consistency to notice</strong><p>${trendNotice(weeks)}</p></div>`}
function historyRow(n,weeks,fn){return `<div class="historyRow"><div>${n}</div>${weeks.map(k=>`<div class="trend">${fn(null,k)}</div>`).join('')}</div>`}function trendNotice(ws){let slips=[];if(ws.filter(k=>weekCount('gospel',k)<6).length>=2)slips.push('Gospel prayer has been below 6/7 in at least two of these weeks.');if(ws.filter(k=>weekCount('bible',k)<5).length>=2)slips.push('Bible reading has been below its 5-day target in at least two weeks.');if(ws.filter(k=>weekThanks(k)<25).length>=2)slips.push('Thankfulness has had lower-entry weeks more than once.');return slips.length?slips.join(' '):'No repeated pattern stands out from these simple thresholds.'}
function setDay(id,v){getDay(dayKey(new Date()))[id]=v;save();render()}function setAwareness(k,v){getDay(k).awareness=+v;save();document.getElementById('pct').textContent=v+'%'}function setThanks(k,i,v){getDay(k).thanks[i]=v;save()}function setWeek(id,v){getWeek(weekKey(new Date()))[id]=v;save();render()}function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const strat=[['Implementation intention','Choose a clear cue: “After I [existing routine], I will [goal].”'],['Habit stacking','Attach the practice to a stable routine you already do regularly.'],['Reduce friction','Make the desired action easier by preparing the needed materials ahead of time.'],['Self-monitoring','Keep recording behavior and review the pattern weekly rather than relying on memory.'],['Specific cue','Choose a consistent time and place for a behavior when that fits your life.']];function openModal(){document.getElementById('strategies').innerHTML=strat.map((s,i)=>`<div class="strategy"><label><input type="checkbox" id="s${i}"> <span><b>${s[0]}</b><br><span class="small">${s[1]}</span></span></label></div>`).join('');document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function addStrategies(){let chosen=strat.filter((s,i)=>document.getElementById('s'+i).checked).map(s=>s[0]);db.selectedStrategies=chosen;save();closeModal();alert(chosen.length?'Added to your preferences: '+chosen.join(', '):'Nothing added.');}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='keystone-habits-data.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('todayTab').onclick=()=>{view='today';render()};document.getElementById('reportTab').onclick=()=>{view='report';render()};document.getElementById('historyTab').onclick=()=>{view='history';render()};render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script></body></html>
